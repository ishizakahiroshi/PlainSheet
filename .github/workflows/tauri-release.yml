name: Tauri Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "build = development artifacts. npm = publish the npm packages again from an existing release."
        type: choice
        default: build
        options:
          - build
          - npm
      tag:
        description: "Existing release tag, required for channel=npm (e.g. v0.1.0)"
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
    tags:
      - "v*"

# Workflow-wide default is least privilege; the release job below elevates to
# contents: write only where it publishes.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # A single-channel run republishes from the existing release; it never builds.
    if: github.event_name != 'workflow_dispatch' || inputs.channel == 'build'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows
          - platform: macos-latest
            os: macos

    steps:
      # Pinned by commit SHA (tags are mutable). SHAs retrieved 2026-08-25.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend checks
        run: |
          bun run lint
          bun run test

      # Windows / Linux: ship the raw portable binary, no installer.
      - name: Build portable binary (Windows / Linux)
        if: matrix.os != 'macos'
        run: bun run tauri build --no-bundle

      # macOS: a raw Mach-O binary is not double-clickable, so build the .app
      # bundle. We still do NOT build the .dmg installer.
      - name: Build .app bundle (macOS)
        if: matrix.os == 'macos'
        run: bun run tauri build --bundles app

      # Each platform produces two deliverables (except macOS, which has only the
      # .app archive): a standalone binary and an archive that also carries the
      # docs/licenses. The release job later proves the archived binary is the
      # same bytes as the standalone one.
      - name: Stage release files (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "src-tauri/target/release"
          $bin = @("PlainSheet.exe", "plainsheet.exe") |
            ForEach-Object { Join-Path $rel $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $bin) { Write-Error "no built binary found" }
          $pkg = "PlainSheet-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "out", "staging/$pkg" | Out-Null
          Copy-Item $bin "out/PlainSheet.exe"
          Copy-Item $bin "staging/$pkg/PlainSheet.exe"
          Copy-Item "README.md", "LICENSE" "staging/$pkg/"
          Compress-Archive -Path "staging/$pkg" -DestinationPath "out/$pkg.zip" -Force

      - name: Stage release files (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          rel=src-tauri/target/release
          bin=""
          for candidate in "$rel/PlainSheet" "$rel/plainsheet"; do
            if [ -f "$candidate" ]; then
              bin="$candidate"
              break
            fi
          done
          test -n "$bin" || { echo "no built binary found"; exit 1; }
          pkg=PlainSheet-linux-x86_64
          mkdir -p out "staging/$pkg"
          cp "$bin" "out/$pkg"
          chmod +x "out/$pkg"
          cp "$bin" "staging/$pkg/$pkg"
          chmod +x "staging/$pkg/$pkg"
          cp README.md LICENSE "staging/$pkg/"
          tar -czf "out/$pkg.tar.gz" -C staging "$pkg"

      - name: Stage release files (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/PlainSheet.app"
          test -d "$app" || { echo "no .app bundle found"; exit 1; }
          pkg=PlainSheet-macos-aarch64
          mkdir -p out "staging/$pkg"
          cp -R "$app" "staging/$pkg/"
          cp README.md LICENSE "staging/$pkg/"
          tar -czf "out/$pkg.tar.gz" -C staging "$pkg"

      - name: Upload build artifacts
        if: github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plainsheet-${{ matrix.platform }}
          path: out/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only the publishing job may write; a concurrency group also prevents two
    # tag runs from racing `gh release upload --clobber` on the same release.
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/assets
          merge-multiple: true

      - name: Verify archived binaries match standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          cd dist/assets
          fail=0
          if [ -f PlainSheet.exe ] && [ -f PlainSheet-windows-x86_64.zip ]; then
            unzip -p PlainSheet-windows-x86_64.zip "PlainSheet-windows-x86_64/PlainSheet.exe" > .win.bin
            a=$(sha256sum .win.bin | cut -d' ' -f1)
            b=$(sha256sum PlainSheet.exe | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then echo "MISMATCH windows exe: $a vs $b" >&2; fail=1; else echo "OK windows exe $b"; fi
            rm -f .win.bin
          fi
          if [ -f PlainSheet-linux-x86_64 ] && [ -f PlainSheet-linux-x86_64.tar.gz ]; then
            tar -xzO -f PlainSheet-linux-x86_64.tar.gz "PlainSheet-linux-x86_64/PlainSheet-linux-x86_64" > .lin.bin
            a=$(sha256sum .lin.bin | cut -d' ' -f1)
            b=$(sha256sum PlainSheet-linux-x86_64 | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then echo "MISMATCH linux binary: $a vs $b" >&2; fail=1; else echo "OK linux binary $b"; fi
            rm -f .lin.bin
          fi
          echo "macOS: only the .app archive is shipped (no standalone single-file binary)."
          exit $fail

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/assets
          files=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort)
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd dist/assets
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -print0)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi
          # Append (idempotently) a checksum section to the release notes.
          body="$(gh release view "$tag" --json body --jq '.body')"
          body="${body%%$'\n---\n\n## SHA-256 Checksums'*}"
          notes="$(mktemp)"
          {
            printf '%s\n\n' "$body"
            printf -- '---\n\n## SHA-256 Checksums\n\n```\n'
            cat SHA256SUMS.txt
            printf '```\n'
          } > "$notes"
          gh release edit "$tag" --notes-file "$notes"
          rm -f "$notes"

  # npm repackages the app: every binary is downloaded from the published
  # GitHub Release and checked against its SHA256SUMS.txt, so npm ships the
  # same bytes. Authentication is npm Trusted Publishing (OIDC); no npm token
  # is stored anywhere, and none must be added to this job.
  npm:
    name: Publish npm packages
    needs: release
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.channel == 'npm')
      )
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the release tag
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag must look like v0.1.0 (got '$RELEASE_TAG')"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Trusted Publishing needs npm 11.5.1 or later; Node 24 carries it. The
      # registry-url input stays unset so setup-node writes no .npmrc with a
      # token placeholder that npm would send instead of the OIDC credential.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Require an npm that supports Trusted Publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$version" \
            || { echo "::error::npm $version is too old for Trusted Publishing (11.5.1 or later required)"; exit 1; }

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .release-assets \
            --pattern SHA256SUMS.txt \
            --pattern PlainSheet.exe \
            --pattern PlainSheet-linux-x86_64 \
            --pattern PlainSheet-macos-aarch64.tar.gz

      - name: Stage the npm packages from the verified assets
        run: node scripts/release/stage-npm-from-release.mjs .release-assets "$RELEASE_TAG"

      - name: Publish platform packages, then the root package
        run: node scripts/release/publish-npm.mjs "$RELEASE_TAG"
